<section class="cc" aria-labelledby="cc-h" hidden>
  <div class="cc__box">
    <h2 class="cc__h" id="cc-h" data-i18n="cc.h">Cookies dhe privatësia</h2>
    <p class="cc__p"><span data-i18n="cc.p">Përdorim cookies vetëm me pëlqimin tuaj: për statistika anonime të vizitave dhe për hartën e Google. Faqja funksionon edhe pa to.</span> <a href="{{PRIVACY}}" data-i18n="cc.more">Politika e privatësisë</a></p>
    <div class="cc__opts" hidden>
      <label class="cc__opt"><input type="checkbox" checked disabled><span><b data-i18n="cc.nec">Të domosdoshme</b><small data-i18n="cc.nec.d">Ruajnë zgjedhjen tuaj për cookies. Gjithmonë aktive.</small></span></label>
      <label class="cc__opt cc__opt--analytics"><input type="checkbox" name="analytics"><span><b data-i18n="cc.an">Statistika</b><small data-i18n="cc.an.d">Google Analytics, për të parë sa vizitorë ka faqja dhe cilat pjesë lexohen.</small></span></label>
      <label class="cc__opt"><input type="checkbox" name="maps"><span><b data-i18n="cc.maps">Harta e Google</b><small data-i18n="cc.maps.d">Ngarkon hartën interaktive të Google Maps te seksioni i kontaktit.</small></span></label>
    </div>
    <div class="cc__btns">
      <button type="button" class="cc__btn" data-cc="reject"><span data-i18n="cc.reject">Vetëm të domosdoshmet</span></button>
      <button type="button" class="cc__btn" data-cc="settings"><span data-i18n="cc.settings" data-i18n-attr="data-settings:cc.settings;data-save:cc.save" data-settings="Cilësimet" data-save="Ruaj zgjedhjen">Cilësimet</span></button>
      <button type="button" class="cc__btn cc__btn--yes" data-cc="accept"><span data-i18n="cc.accept">Prano të gjitha</span></button>
    </div>
  </div>
</section>
